; Copied into the WLED checkout by CI. Builds WLED for ESP32-C3 with only the LD2450 usermod.
[platformio]
default_envs = esp32c3_ld2450

[env:esp32c3_ld2450]
extends = env:esp32c3dev
custom_usermods = LD2450_Presence INA226_v2
build_flags = ${common.build_flags} ${esp32c3.build_flags}
  -D WLED_RELEASE_NAME=\"ESP32-C3-LD2450\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D LOLIN_WIFI_FIX
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; compile-time default pins (slat board map; all changeable on the Usermod settings page)
  ; GPIO20/21 stay free so WLED keeps Improv/serial over USB
  -D LD2450_RX_PIN=7
  -D LD2450_TX_PIN=10
  -D LD2450_OUT1_PIN=4
  -D LD2450_OUT2_PIN=5
  -D LD2450_DIM1_PIN=3
  -D LD2450_DIM2_PIN=1
  -D LD2450_THERM_PIN=0
